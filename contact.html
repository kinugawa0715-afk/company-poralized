<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ | 株式会社poralized</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <div class="header-inner">
            <h1><a href="index.html">poralized<span class="dot">.</span></a></h1> 
            <nav>
                <ul class="nav-list">
                    <li><a href="index.html">TOP</a></li>
                    <li><a href="philosophy.html">PHILOSOPHY</a></li>
                    <li><a href="service.html">SERVICE</a></li>
                    <li><a href="company.html">COMPANY</a></li>
                    <li><a href="contact.html" class="contact-btn">CONTACT</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-header relative-section">
            <div class="parallax-bg-wrap">
                <img src="https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=2029&auto=format&fit=crop" alt="Contact Background" class="parallax-img">
            </div>
            <div class="container">
                <h2>CONTACT</h2>
                <p>お問い合わせ</p>
            </div>
            <div class="breadcrumbs">
                <div class="container">
                    <a href="index.html">TOP</a> &gt; <span>CONTACT</span>
                </div>
            </div>
        </section>

        <section class="section-padding fade-in-section">
            <div class="container">
                <div class="section-header" style="text-align: center;">
                    <span class="en-title">INQUIRY</span>
                    <h3 class="page-sub-title" style="border: none; padding: 0;">Contact Form</h3>
                    <p style="color:#ccc; margin-bottom: 40px;">
                        動画制作のご依頼、AI技術に関するご質問など、<br>
                        お気軽にお問い合わせください。<br>
                        通常3営業日以内に担当者よりご連絡いたします。
                    </p>
                </div>

                <div class="form-wrapper">
                    <form action="https://formspree.io/f/mjknndld" method="POST" class="original-form">
                        
                        <div class="form-group">
                            <label for="name">Name <span class="required">*</span></label>
                            <input type="text" id="name" name="name" placeholder="山田 太郎" required>
                        </div>

                        <div class="form-group">
                            <label for="company">Company</label>
                            <input type="text" id="company" name="company" placeholder="株式会社poralized">
                        </div>

                        <div class="form-group">
                            <label for="email">Email <span class="required">*</span></label>
                            <input type="email" id="email" name="email" placeholder="example@poralized.com" required>
                        </div>

                        <div class="form-group">
                            <label for="message">Message <span class="required">*</span></label>
                            <textarea id="message" name="message" rows="6" placeholder="お問い合わせ内容をご記入ください..." required></textarea>
                        </div>

                        <div class="form-submit">
                            <button type="submit" class="submit-btn">Send Message</button>
                        </div>
                    </form>
                </div>
                
            </div>
        </section>

        <section class="section-padding bg-dark fade-in-section">
            <div class="container narrow contact-info-area" style="text-align: center;">
                <div class="info-box">
                    <h4 style="color:#fff; font-size: 1.2rem; margin-bottom: 15px;">お急ぎの方はこちら</h4>
                    <p class="email-link">info@poralized.co.jp</p>
                    <p class="note" style="font-size:0.8rem; color:#666; margin-top: 20px;">※ 営業メール等はご遠慮ください。</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container"><p class="copyright">&copy; 2025 poralized Inc.</p></div>
    </footer>

</body>
</html>
